<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Srota Partner audiobook illustration</title>
  <desc id="desc">A modern white and violet SVG illustration of headphones wrapped around an open book, designed for the Srota Partner UI theme.</desc>

  <defs>
    <linearGradient id="violet" x1="160" y1="150" x2="1040" y2="1050" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B5CF6"/>
      <stop offset="0.45" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="violetSoft" x1="365" y1="390" x2="830" y2="1020" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="0.55" stop-color="#F8F5FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="pageGradLeft" x1="245" y1="560" x2="602" y2="965" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F1FF"/>
    </linearGradient>
    <linearGradient id="pageGradRight" x1="955" y1="560" x2="600" y2="965" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F1FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="52%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="0.48" stop-color="#C084FC" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#3B0764" flood-opacity="0.12"/>
    </filter>
    <filter id="miniShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4C1D95" flood-opacity="0.12"/>
    </filter>
    <style>
      .stroke-main { stroke: url(#violet); stroke-width: 32; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-med { stroke: url(#violet); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-thin { stroke: #8B5CF6; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: .5; }
      .page-line { stroke: #8B5CF6; stroke-width: 4; stroke-linecap: round; opacity: .32; }
    </style>
  </defs>

  <rect width="1200" height="1200" rx="64" fill="#FFFFFF"/>
  <circle cx="600" cy="630" r="500" fill="url(#glow)"/>

  <!-- decorative theme lines -->
  <path d="M88 865C175 776 265 738 360 752" stroke="#A78BFA" stroke-width="3" stroke-dasharray="2 18" stroke-linecap="round" opacity="0.45"/>
  <path d="M1112 865C1025 776 935 738 840 752" stroke="#A78BFA" stroke-width="3" stroke-dasharray="2 18" stroke-linecap="round" opacity="0.45"/>
  <path d="M210 1015C370 955 822 955 990 1018" stroke="#C4B5FD" stroke-width="3" opacity="0.35"/>
  <path d="M250 1045C405 1000 795 1000 950 1045" stroke="#DDD6FE" stroke-width="3" opacity="0.55"/>

  <!-- Headphones -->
  <g filter="url(#softShadow)">
    <path class="stroke-main" d="M214 696V594C214 380 387 206 600 206C813 206 986 380 986 594V696"/>
    <path d="M312 698C312 640 265 592 207 592C149 592 102 640 102 698V807C102 865 149 912 207 912C265 912 312 865 312 807V698Z" fill="#FFFFFF" stroke="url(#violet)" stroke-width="30"/>
    <path d="M888 698C888 640 935 592 993 592C1051 592 1098 640 1098 698V807C1098 865 1051 912 993 912C935 912 888 865 888 807V698Z" fill="#FFFFFF" stroke="url(#violet)" stroke-width="30"/>
    <path d="M176 672C152 698 152 828 176 852" stroke="#EDE9FE" stroke-width="22" stroke-linecap="round"/>
    <path d="M1024 672C1048 698 1048 828 1024 852" stroke="#EDE9FE" stroke-width="22" stroke-linecap="round"/>
    <path d="M327 331C382 275 478 242 600 242C722 242 818 275 873 331" stroke="#C4B5FD" stroke-width="18" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Open book -->
  <g filter="url(#softShadow)">
    <path d="M600 949C518 900 400 881 256 898C240 900 226 888 226 872V485C226 468 240 455 257 455C411 461 522 502 600 578V949Z" fill="url(#pageGradLeft)" stroke="url(#violet)" stroke-width="20" stroke-linejoin="round"/>
    <path d="M600 949C682 900 800 881 944 898C960 900 974 888 974 872V485C974 468 960 455 943 455C789 461 678 502 600 578V949Z" fill="url(#pageGradRight)" stroke="url(#violet)" stroke-width="20" stroke-linejoin="round"/>
    <path d="M600 578V949" class="stroke-med"/>
    <path d="M257 455C410 464 522 508 600 588" stroke="#C4B5FD" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
    <path d="M943 455C790 464 678 508 600 588" stroke="#C4B5FD" stroke-width="8" stroke-linecap="round" opacity="0.65"/>

    <!-- left page text lines -->
    <path class="page-line" d="M306 548H515"/><path class="page-line" d="M306 578H538"/><path class="page-line" d="M306 608H527"/><path class="page-line" d="M306 638H548"/>
    <path class="page-line" d="M306 682H525"/><path class="page-line" d="M306 712H545"/><path class="page-line" d="M306 742H520"/><path class="page-line" d="M306 772H540"/>
    <path class="page-line" d="M306 816H510"/><path class="page-line" d="M306 846H534"/>

    <!-- right page text lines -->
    <path class="page-line" d="M685 548H894"/><path class="page-line" d="M662 578H894"/><path class="page-line" d="M673 608H894"/><path class="page-line" d="M652 638H894"/>
    <path class="page-line" d="M675 682H894"/><path class="page-line" d="M655 712H894"/><path class="page-line" d="M680 742H894"/><path class="page-line" d="M660 772H894"/>
    <path class="page-line" d="M690 816H894"/><path class="page-line" d="M666 846H894"/>

    <!-- page stack accents -->
    <path d="M248 898C370 880 500 901 600 949" stroke="#DDD6FE" stroke-width="8" opacity="0.8"/>
    <path d="M952 898C830 880 700 901 600 949" stroke="#DDD6FE" stroke-width="8" opacity="0.8"/>
    <path d="M600 949C565 929 526 913 482 903" stroke="#A78BFA" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <path d="M600 949C635 929 674 913 718 903" stroke="#A78BFA" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Audio wave accent in the book center -->
  <g filter="url(#miniShadow)">
    <circle cx="600" cy="470" r="58" fill="#FFFFFF" stroke="url(#violet)" stroke-width="12"/>
    <path d="M552 471H568L580 442L604 500L621 458L634 471H648" class="stroke-med"/>
  </g>

  <!-- small colorful/pastel theme dots -->
  <circle cx="224" cy="392" r="16" fill="#F0ABFC" opacity="0.55"/>
  <circle cx="971" cy="410" r="12" fill="#60A5FA" opacity="0.5"/>
  <circle cx="860" cy="1010" r="10" fill="#34D399" opacity="0.45"/>
  <circle cx="330" cy="980" r="10" fill="#FB7185" opacity="0.35"/>
</svg>
